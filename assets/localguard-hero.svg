<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">LOCALGUARD — Your Local Security Guardian</title>
  <desc id="description">A polished dark cybersecurity hero banner with a luminous green shield and checkmark, circuit details, and the LOCALGUARD name.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="74%">
      <stop stop-color="#12241b"/>
      <stop offset=".52" stop-color="#0a120e"/>
      <stop offset="1" stop-color="#060908"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#1b5131" stop-opacity=".5"/>
      <stop offset="1" stop-color="#102017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#183326"/>
      <stop offset="1" stop-color="#09120d"/>
    </linearGradient>
    <linearGradient id="shield-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5ff8b"/>
      <stop offset="1" stop-color="#26d875"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8cdba1" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.91 0 0 0 0 0.42 0 0 0 0.82 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x2="0" y2="1">
      <stop stop-color="#6bf59a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6bf59a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#6bf59a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .language-chip { animation: chip-pulse 3.6s ease-in-out infinite; }
      .language-chip:nth-child(2) { animation-delay: -1.2s; }
      .language-chip:nth-child(3) { animation-delay: -2.4s; }
      @keyframes chip-pulse {
        0%, 100% { opacity: .68; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .language-chip { animation: none; }
      }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="344" rx="520" ry="410" fill="url(#halo)"/>
  <g fill="none" stroke="#4aa66a" stroke-opacity=".22" stroke-width="2">
    <path d="M0 248h210l42 42h160m-412 38h244l24-24h130M0 528h210l42-42h160"/>
    <path d="M1600 248h-210l-42 42h-160m412 38h-244l-24-24h-130m398 234h-210l-42-42h-160"/>
    <path d="M0 684h300l50-50h106m1144 50h-300l-50-50h-106"/>
  </g>
  <g fill="#72efa0" fill-opacity=".72">
    <circle cx="210" cy="248" r="4"/><circle cx="420" cy="328" r="4"/><circle cx="210" cy="528" r="4"/>
    <circle cx="1390" cy="248" r="4"/><circle cx="1180" cy="328" r="4"/><circle cx="1390" cy="486" r="4"/>
    <circle cx="300" cy="684" r="4"/><circle cx="1300" cy="684" r="4"/>
    <circle cx="360" cy="170" r="2"/><circle cx="1250" cy="202" r="2"/><circle cx="290" cy="420" r="2"/>
    <circle cx="1320" cy="418" r="2"/><circle cx="470" cy="760" r="2"/><circle cx="1120" cy="744" r="2"/>
  </g>
  <g opacity=".8">
    <circle cx="800" cy="277" r="164" fill="none" stroke="#9aff65" stroke-opacity=".12" stroke-width="1"/>
    <circle cx="800" cy="277" r="144" fill="none" stroke="#69ec94" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="2 12"/>
    <circle cx="800" cy="277" r="126" fill="none" stroke="#59ec86" stroke-opacity=".2" stroke-width="1"/>
  </g>
  <g>
    <path d="M800 146c34 20 69 29 92 35v69c0 58-36 103-92 128-56-25-92-70-92-128v-69c23-6 58-15 92-35Z" fill="url(#shield-fill)" stroke="url(#shield-stroke)" stroke-width="5" filter="url(#glow)"/>
    <path d="M800 168c27 15 54 22 70 27v55c0 45-27 79-70 102-43-23-70-57-70-102v-55c16-5 43-12 70-27Z" fill="none" stroke="#4b8e63" stroke-width="2"/>
    <path d="m759 267 28 28 57-61" fill="none" stroke="#a9ff70" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="534" fill="#f4f8f5" font-size="86" font-weight="760" letter-spacing="8">LOCALGUARD</text>
    <rect x="740" y="568" width="120" height="3" rx="1.5" fill="#5be98b"/>
    <text x="800" y="632" fill="#c0cec4" font-size="31" font-weight="450" letter-spacing="1.8">Your Local Security Guardian</text>
    <text x="800" y="698" fill="#86a092" font-size="16" font-weight="600" letter-spacing="4">OFFLINE SECURITY &amp; METADATA CHECKS FOR YOUR LOCAL FILES</text>
    <g font-size="14" font-weight="650" letter-spacing="1.5">
      <g class="language-chip" fill="#0b1710" stroke="#315440" stroke-width="1.5">
        <rect x="618" y="738" width="112" height="36" rx="18"/>
        <text x="674" y="761" fill="#b5f3c7" stroke="none">PYTHON</text>
      </g>
      <g class="language-chip" fill="#0b1710" stroke="#315440" stroke-width="1.5">
        <rect x="744" y="738" width="112" height="36" rx="18"/>
        <text x="800" y="761" fill="#b5f3c7" stroke="none">HTML5</text>
      </g>
      <g class="language-chip" fill="#0b1710" stroke="#315440" stroke-width="1.5">
        <rect x="870" y="738" width="112" height="36" rx="18"/>
        <text x="926" y="761" fill="#b5f3c7" stroke="none">CSS3</text>
      </g>
    </g>
  </g>
  <g stroke="url(#fade)" stroke-width="1.5" fill="none" opacity=".8">
    <path d="M260 810h1080"/>
  </g>
  <g fill="#83f4a8" fill-opacity=".6">
    <circle cx="260" cy="810" r="3"/><circle cx="1340" cy="810" r="3"/>
    <circle cx="520" cy="118" r="2"/><circle cx="1050" cy="124" r="2"/><circle cx="690" cy="780" r="2"/>
    <circle cx="920" cy="770" r="2"/><circle cx="350" cy="570" r="2"/><circle cx="1260" cy="575" r="2"/>
  </g>
</svg>
