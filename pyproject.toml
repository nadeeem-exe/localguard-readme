[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localguard"
version = "0.1.0"
description = "A small, offline security checker for local project files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LocalGuard contributors" }]
dependencies = []

[project.scripts]
localguard = "localguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
